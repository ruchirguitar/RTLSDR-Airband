# Recording a net: every transmission in one gap-free file.
# With split_on_transmission only audio with squelch open is written, and the
# file stays open across silences shorter than split_max_idle_time, so a net
# with gaps under a minute becomes one file with the silences removed.
#   split_gap_tone         two soft pips where each silence was cut out
#   split_normalize        brings each transmission to split_normalize_target
#                          RMS (dBFS, default -20) so weak and strong stations
#                          play at the same volume
#   split_segment_log      writes <file>.segments.tsv next to the mp3: start and
#                          end of every transmission in the file (seconds) and
#                          its wall-clock start, e.g. for aligning a transcript
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

localtime = true;

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 30;
  centerfreq = 145.300;
  channels:
  (
    {
      freq = 145.400;
      modulation = "nfm";
      outputs: (
        {
          type = "file";
          directory = "/home/pi/recordings/145.400";
          filename_template = "145.400";
          dated_subdirectories = true;
          split_on_transmission = true;
          split_max_idle_time = 60;
          split_max_file_time = 7200;
          split_tx_drop_shorter_than = 0.5;
          split_gap_tone = true;
          split_normalize = true;
          split_segment_log = true;
        }
      );
    }
  );
 }
);
